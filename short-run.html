<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corto plazo · Macro Models</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23174f58'/%3E%3Cpath d='M6 23L13 15L18 19L26 9' stroke='%23f4ede3' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<header class="appbar">
  <a class="brand" href="index.html">
    <span data-i18n="site.name">Macro Models</span>
    <small data-i18n="site.course"></small>
  </a>
  <nav class="navpills">
    <a href="index.html" data-nav="home" data-i18n="nav.home"></a>
    <a href="short-run.html" data-nav="shortrun" data-i18n="nav.shortrun"></a>
    <a href="long-run.html" data-nav="longrun" data-i18n="nav.longrun"></a>
  </nav>
  <span class="spacer"></span>
  <button id="exam-toggle" class="btn" type="button" aria-pressed="true"></button>
  <div id="lang-host"></div>
</header>

<div class="split" id="split">

  <aside class="exam-pane" id="exam-pane">
    <div class="exam-head">
      <h2 data-i18n="exam.title"></h2>
      <span id="exam-info" class="unit"></span>
      <span class="spacer"></span>
      <div id="exam-tools" class="actions"></div>
    </div>
    <div class="exam-body" id="exam-body"></div>
  </aside>

  <button class="gutter" id="gutter" type="button" aria-label="resize" tabindex="-1"></button>

  <main class="models-pane" id="models-root">

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="ui.parameters"></h2>
        <span class="spacer"></span>
        <div id="variant-host" class="actions"></div>
      </div>
      <div class="card-body">
        <div id="actions-host" class="actions" style="margin-bottom:14px"></div>
        <div id="params-host"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="ui.endogenous"></h2>
        <span class="spacer"></span>
        <button id="table-png" class="btn tiny" type="button" data-i18n="ui.png"></button>
      </div>
      <div class="card-body">
        <div class="table-wrap" id="table-host"></div>
      </div>
    </section>

    <div class="plot-grid" id="plot-host"></div>

    <section class="card" style="margin-top:16px">
      <div class="card-head"><h2 data-i18n="ui.equations"></h2></div>
      <div class="card-body" id="equations-host"></div>
    </section>

    <footer class="foot">
      <div data-i18n="site.prof"></div>
      <div data-i18n="site.book"></div>
    </footer>

  </main>
</div>

<script type="module" src="assets/js/pages/shortrun.js"></script>
</body>
</html>
